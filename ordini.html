<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icon.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/ordini.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <button class="header-back" onclick="window.location.href='index.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Sala
    </button>
    <div class="header-title">Menu Ordini</div>
    <div class="header-table" id="tableIndicator">Tavolo --</div>
  </header>

  <!-- BODY -->
  <div class="app-body">
    
    <!-- CATEGORIES -->
    <aside class="sidebar-cats" id="catList">
      <!-- Injected by JS -->
    </aside>

    <!-- MAIN MENU GRID -->
    <main class="main-content" id="mainContent">
      <div class="cat-title" id="currentCatTitle">
        <span>🍽️</span> Tutte le categorie
      </div>
      <div class="order-search" style="margin-top:12px; display:flex; gap:8px;">
        <input type="text" id="orderSearch" placeholder="Cerca nel menu..." style="flex:1; padding:8px 12px; border:1px solid var(--border); border-radius:8px; background: var(--surface); color: var(--text);" />
      </div>
      <div class="menu-grid" id="menuGrid">
        <!-- Injected by JS -->
      </div>
    </main>

    <!-- CART PANEL -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <aside class="cart-panel" id="cartPanel">
      <div class="cart-header">
        <h2>Comanda</h2>
        <button class="cart-close-mobile" id="cartCloseBtn">✕</button>
      </div>
      <div class="cart-items" id="cartItems">
        <div class="cart-empty">Il carrello è vuoto</div>
      </div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Totale</span>
          <span id="cartTotal">0.00 €</span>
        </div>
        <button class="btn-send" id="btnSend" disabled onclick="sendOrder()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          Invia in Cucina
        </button>
      </div>
    </aside>

  </div>

  <!-- MOBILE FAB -->
  <button class="mobile-cart-toggle" id="mobileCartBtn">
    <span>Carrello</span>
    <span id="mobileCartTotal">0.00 €</span>
  </button>

  <script type="module" src="js/ordini.js"></script>
</body>
</html>
